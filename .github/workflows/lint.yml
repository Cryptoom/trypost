name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Run Pint
        run: composer test:lint

      - name: Resolve diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "DIFF_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: Check changed frontend files
        run: |
          mapfile -t resources < <(git diff --name-only --diff-filter=ACM "$DIFF_BASE"...HEAD | rg '^resources/' || true)
          if [ "${#resources[@]}" -gt 0 ]; then
            npx prettier --check "${resources[@]}"
          fi

          mapfile -t code < <(printf '%s\n' "${resources[@]}" | rg '\.(ts|vue)$' || true)
          if [ "${#code[@]}" -gt 0 ]; then
            npx eslint "${code[@]}"
          fi
