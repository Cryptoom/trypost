<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<title>story</title>
<link rel="stylesheet" href="fonts.css"/>
<style>
html, body { margin: 0; background: #000; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
.layer { position: absolute; inset: 0; }
#photo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; will-change: transform; }
#scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; opacity: 0; }
#headline { position: absolute; left: 60px; top: 300px; width: 960px; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 0.3em; row-gap: 0.04em; font-family: "StorySerif", "Noto Serif", serif; font-weight: 700; font-size: 104px; line-height: 1.12; color: #fff; text-align: center; text-shadow: 0 2px 22px rgba(0,0,0,0.6); }
#headline .wd { display: inline-block; max-width: 960px; opacity: 0; }
#headline.breakall .wd { overflow-wrap: anywhere; word-break: break-all; }
</style>
<script src="gsap.min.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="__DURATION__">
  <div id="cam" class="layer clip" data-start="0" data-duration="__DURATION__" data-track-index="0"><img id="photo" src="__PHOTO__" alt=""/></div>
  <div id="overlay" class="layer clip" data-start="0" data-duration="__DURATION__" data-track-index="1"><div id="scrim"></div><div id="headline"></div></div>
</div>
<script src="story.js"></script>
</body>
</html>
